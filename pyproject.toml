[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "kpfu-web-assistant"
version = "0.1.0"
description = "RAG-ассистент по официальному сайту Казанского федерального университета"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "qdrant-client (>=1.20.0,<2.0.0)",
    "sentence-transformers (>=6.2.0,<7.0.0)",
    "transformers (>=5.22.1,<6.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "sentencepiece (>=0.2.2,<0.3.0)",
    "sacrebleu (>=2.6.0,<3.0.0)",
    "bert-score (>=0.3.13,<0.4.0)",
    "evaluate (>=0.4.6,<0.5.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "nltk (>=3.10.4,<4.0.0)",
    "python-json-logger (>=4.2.0,<5.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
ruff = ">=0.8.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"