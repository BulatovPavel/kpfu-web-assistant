services:
  postgres:
    image: postgres:16-alpine
    container_name: kpfu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kpfu_assistant
      POSTGRES_USER: kpfu
      POSTGRES_PASSWORD: kpfu_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpfu -d kpfu_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
